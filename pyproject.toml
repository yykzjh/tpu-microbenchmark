[project]
name = "tpu-microbenchmark"
version = "0.2.0"
description = "TPU microbenchmark suite: HBM, VMEM, GEMM, PCIe, and ICI bandwidth tests"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "absl-py",
    "jax==0.11.1",
    "jaxlib==0.11.1",
    "libtpu==0.0.46; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "jsonlines>=4.0",
    "numpy>=2.0",
    "tpu-info==0.14.2; sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
find-links = ["https://storage.googleapis.com/jax-releases/libtpu_releases.html"]
index-strategy = "first-index"

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple/"
